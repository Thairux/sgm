<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#13151b">
  <title>{% if page.title %}{{ page.title }} — {% endif %}SGM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="page">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="mark">S</span>
        <span>SGM</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Overview</a>
        <a href="{{ '/spec/' | relative_url }}" {% if page.url == '/spec/' %}class="active"{% endif %}>Spec</a>
        <a href="{{ '/schemas/' | relative_url }}" {% if page.url == '/schemas/' %}class="active"{% endif %}>Schemas</a>
        <a href="{{ '/conformance/' | relative_url }}" {% if page.url == '/conformance/' %}class="active"{% endif %}>Conformance</a>
        <a href="https://github.com/Thairux/sgm" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="page">
      <p>&copy; {{ 'now' | date: "%Y" }} Peter Thairu Muigai — SGM is released under the GNU AGPL v3.0.</p>
      <div class="social-links">
        <a href="https://github.com/Thairux/sgm" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://github.com/Thairux/sgm/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">License</a>
      </div>
    </div>
  </footer>

</body>
</html>
