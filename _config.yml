url: "https://thairux.github.io"
baseurl: "/sgm"

author:
  name: Peter Thairu Muigai
  email: ptmthairu@gmail.com
  location: Lanet, Nakuru, Kenya

navigation:
  - name: Overview
    url: /
  - name: Specification
    url: /spec/
  - name: Schemas
    url: /schemas/
  - name: Conformance
    url: /conformance/
  - name: GitHub
    url: https://github.com/Thairux/sgm

social_profiles:
  github: "https://github.com/Thairux/sgm"
  twitter: ""
  instagram: ""
  facebook: ""
